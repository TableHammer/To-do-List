<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Todo App</title>
        <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <h1>Todo App</h1>
    <div class="card">
        <div class="wrapper">
            <form>
                <input id="todo-input" type="text"
                placeholder="write your tasks and press Enter for confirmation" autocomplete="off">
                <button id="add-button">ADD</button>
            </form>
            <ul id="todo-list">
            </ul>
        </div>
    </div>
</body>
<script src="app.js"></script>
</html>
